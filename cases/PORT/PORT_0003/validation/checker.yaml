normalization_notes:
  - top-1 result comparison should normalize row rendering before value comparison
  - scalar text outputs should be whitespace-trimmed
  - null rendering should be normalized before comparison
  - ordering logic should be preserved rather than dropped during adaptation review
result_ordering_assumptions:
  - source query is intentionally order-sensitive because of LIMIT 1
  - positive rewrite is expected to preserve the effective top-row choice
  - negative rewrite is expected to change the chosen row by altering sort semantics
null_handling_assumptions:
  - source semantics depend on explicit NULLS LAST behavior
  - MySQL-like positive rewrite relies on implicit exclusion of nulls from the descending winner in the draft witness
  - Spark draft should later use an explicit null-order expression during execution review
known_risks:
  - null-order handling is central to the portability story
  - Spark rewrite is still marked review-required
  - witness data has not been implemented
  - a witness with no null or tie pressure would under-test the portability claim
