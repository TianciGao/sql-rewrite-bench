status: draft_only
not_executed: true
validation_model: cross_dialect_reference
source_reference:
  engine: pg
  query_file: source.sql
  output: runs/pg/source.tsv
target_positive_checks:
  - engine: mysql
    query_file: rewrite_pos_01.sql
    output: runs/mysql/rewrite_pos_01.tsv
    compare_to: runs/pg/source.tsv
    expected_relation: equivalent_pending_execution
  - engine: spark
    query_file: rewrite_pos_02_spark.sql
    output: runs/spark/rewrite_pos_02_spark.tsv
    compare_to: runs/pg/source.tsv
    expected_relation: equivalent_pending_execution
target_negative_checks:
  - engine: mysql
    query_file: rewrite_neg_01.sql
    output: runs/mysql/rewrite_neg_01.tsv
    compare_to: runs/pg/source.tsv
    expected_relation: non_equivalent_pending_execution
  - engine: spark
    query_file: rewrite_neg_02_spark.sql
    output: runs/spark/rewrite_neg_02_spark.tsv
    compare_to: runs/pg/source.tsv
    expected_relation: non_equivalent_pending_execution
normalization_notes:
  - top-1 result comparison should normalize row rendering before comparison
  - scalar text outputs should be whitespace-trimmed
  - timestamp formatting differences should be ignored because the selected nationality is the compared output
  - cross-engine text formatting may still need normalization before equality checks
result_ordering_assumptions:
  - source query is intentionally order-sensitive because of LIMIT 1
  - PostgreSQL source output is the semantic reference for later MySQL and Spark checks
  - positive rewrites are expected to preserve the earliest non-null row choice
  - negative rewrites are expected to change the chosen row by reversing sort direction
known_risks:
  - order direction is central to the portability story
  - Spark rewrite is still marked review-required
  - witness data is draft-only and not yet loaded
  - cross-engine text formatting may still require normalization review
