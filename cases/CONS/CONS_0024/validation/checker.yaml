type: value_normalized_result_equivalence_checker
status: pg_witness_validated
normalization:
  sort_rows: true
  trim_whitespace: true
  normalize_numeric_format: true
  normalize_null: true
inputs:
  source: source.sql
  positive_rewrite: rewrite_pos_01.sql
  negative_rewrite: rewrite_neg_01.sql
expectations:
  equal:
    - source.sql
    - rewrite_pos_01.sql
  not_equal:
    - source.sql
    - rewrite_neg_01.sql
expected_results:
  source: runs/pg/source.tsv
  positive_rewrite: runs/pg/rewrite_pos_01.tsv
  negative_rewrite: runs/pg/rewrite_neg_01.tsv
validation_evidence:
  - runs/result_check.json
  - runs/pg/result_check.json
notes:
  - PostgreSQL-only witness-backed checker config derived from existing TSV artifacts.
  - Existing root and PostgreSQL result_check evidence already validate source=positive and source!=negative.
  - This checker config is a narrow Batch 2B backfill only, not an admission, promotion, or formal review claim.
